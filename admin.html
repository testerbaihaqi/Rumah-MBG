<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔑 Admin Panel – Warung Kecil Bahagia</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #FF4C4C;
    --yellow: #FFD93D;
    --green: #6BCB77;
    --blue: #4D96FF;
    --orange: #FF9F1C;
    --pink: #FF6B9D;
    --purple: #C77DFF;
    --dark: #1E1E2E;
    --dark2: #2A2A3E;
    --dark3: #32324A;
    --sidebar: #16162A;
    --text: #E8E8F0;
    --text2: #9999BB;
    --accent: #FFD93D;
    --card-bg: #22223A;
    --radius: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 240px;
    background: var(--sidebar);
    min-height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    border-right: 2px solid rgba(255,255,255,0.05);
    transition: transform 0.3s;
  }

  .sidebar-logo {
    padding: 24px 20px 20px;
    border-bottom: 2px solid rgba(255,255,255,0.06);
  }

  .sidebar-logo .logo-emoji {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 8px;
    animation: wobble 3s infinite;
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-8deg); }
    75% { transform: rotate(8deg); }
  }

  .sidebar-logo h2 {
    font-family: 'Fredoka One', cursive;
    color: var(--accent);
    font-size: 1.1rem;
    line-height: 1.2;
  }

  .sidebar-logo p { font-size: 0.75rem; color: var(--text2); margin-top: 2px; }

  .sidebar-nav { flex: 1; padding: 16px 12px; }

  .nav-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text2);
    padding: 0 8px;
    margin: 16px 0 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 12px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text2);
    transition: all 0.15s;
    position: relative;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }

  .nav-item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .nav-item.active { background: rgba(255,217,61,0.12); color: var(--accent); }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
  }

  .nav-icon { font-size: 1.1rem; }

  .nav-badge {
    margin-left: auto;
    background: var(--red);
    color: white;
    font-size: 0.7rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sidebar-footer {
    padding: 16px;
    border-top: 2px solid rgba(255,255,255,0.06);
  }

  .go-customer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: rgba(107,203,119,0.12);
    border-radius: 12px;
    color: var(--green);
    font-weight: 700;
    font-size: 0.85rem;
    text-decoration: none;
    transition: background 0.15s;
  }

  .go-customer:hover { background: rgba(107,203,119,0.22); }

  /* ===== MAIN CONTENT ===== */
  .main {
    margin-left: 240px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .topbar {
    background: var(--dark2);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid rgba(255,255,255,0.05);
    position: sticky;
    top: 0;
    z-index: 40;
  }

  .topbar h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
    color: var(--accent);
  }

  .topbar-right { display: flex; gap: 12px; align-items: center; }

  .live-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--green);
    font-weight: 700;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    animation: blink 1.5s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .admin-name {
    background: rgba(255,255,255,0.08);
    padding: 7px 14px;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 700;
  }

  /* ===== PAGE SECTIONS ===== */
  .page { padding: 28px; display: none; }
  .page.active { display: block; }

  /* ===== STATS CARDS ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    border: 2px solid rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    opacity: 0.1;
  }

  .stat-card.s1::before { background: var(--accent); }
  .stat-card.s2::before { background: var(--green); }
  .stat-card.s3::before { background: var(--red); }
  .stat-card.s4::before { background: var(--blue); }

  .stat-icon { font-size: 2rem; margin-bottom: 10px; }
  .stat-label { font-size: 0.8rem; color: var(--text2); margin-bottom: 4px; font-weight: 600; }
  .stat-value { font-family: 'Fredoka One', cursive; font-size: 1.8rem; }
  .stat-card.s1 .stat-value { color: var(--accent); }
  .stat-card.s2 .stat-value { color: var(--green); }
  .stat-card.s3 .stat-value { color: var(--red); }
  .stat-card.s4 .stat-value { color: var(--blue); }

  /* ===== SECTION HEADER ===== */
  .section-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .section-hdr h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    padding: 10px 20px;
    border-radius: 50px;
    border: none;
    font-family: 'Fredoka One', cursive;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: var(--dark); }
  .btn-success { background: var(--green); color: white; }
  .btn-danger { background: var(--red); color: white; }
  .btn-ghost { background: rgba(255,255,255,0.08); color: var(--text); }
  .btn-sm { padding: 6px 14px; font-size: 0.8rem; }

  /* ===== ORDERS TABLE ===== */
  .orders-filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 7px 16px;
    border-radius: 50px;
    border: 2px solid rgba(255,255,255,0.1);
    background: transparent;
    color: var(--text2);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent); }

  .orders-container { display: flex; flex-direction: column; gap: 12px; }

  .order-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 18px 20px;
    border: 2px solid rgba(255,255,255,0.06);
    transition: border-color 0.2s;
    animation: fadeSlide 0.3s ease;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .order-card.status-baru { border-left: 4px solid var(--accent); }
  .order-card.status-diproses { border-left: 4px solid var(--blue); }
  .order-card.status-selesai { border-left: 4px solid var(--green); }
  .order-card.status-dibatalkan { border-left: 4px solid var(--red); }

  .order-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .order-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  .order-id {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    color: var(--accent);
  }

  .order-table-tag {
    background: rgba(255,217,61,0.12);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .status-tag {
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 800;
  }

  .status-tag.baru { background: rgba(255,217,61,0.15); color: var(--accent); }
  .status-tag.diproses { background: rgba(77,150,255,0.15); color: var(--blue); }
  .status-tag.selesai { background: rgba(107,203,119,0.15); color: var(--green); }
  .status-tag.dibatalkan { background: rgba(255,76,76,0.15); color: var(--red); }

  .pay-tag {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255,255,255,0.06);
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 0.75rem;
    color: var(--text2);
    font-weight: 700;
  }

  .order-items {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .order-item-tag {
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .order-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .order-total {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    color: var(--green);
  }

  .order-note {
    font-size: 0.8rem;
    color: var(--text2);
    font-style: italic;
    margin-bottom: 8px;
  }

  .order-time { font-size: 0.75rem; color: var(--text2); }

  .status-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ===== MENU MANAGEMENT ===== */
  .menu-admin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .menu-admin-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 2px solid rgba(255,255,255,0.06);
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .menu-admin-card:hover { border-color: rgba(255,217,61,0.3); }
  .menu-admin-card.unavail { opacity: 0.5; }

  .mac-thumb {
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    position: relative;
  }

  .mac-body { padding: 14px 16px; }
  .mac-name { font-family: 'Fredoka One', cursive; font-size: 1rem; margin-bottom: 3px; }
  .mac-desc { font-size: 0.78rem; color: var(--text2); margin-bottom: 8px; line-height: 1.4; }
  .mac-price { font-family: 'Fredoka One', cursive; color: var(--accent); margin-bottom: 10px; }
  .mac-footer { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }

  .avail-toggle {
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--text2);
    cursor: pointer;
  }

  .toggle-switch {
    width: 36px;
    height: 20px;
    background: #444;
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .toggle-switch.on { background: var(--green); }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    background: white;
    border-radius: 50%;
    transition: left 0.2s;
  }

  .toggle-switch.on::after { left: 18px; }

  /* ===== TABLE MANAGEMENT ===== */
  .table-admin-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .table-admin-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    border: 2px solid rgba(255,255,255,0.08);
    transition: all 0.15s;
  }

  .table-admin-card:hover { border-color: rgba(255,217,61,0.3); }

  .tac-icon { font-size: 2rem; margin-bottom: 8px; }
  .tac-num { font-family: 'Fredoka One', cursive; font-size: 1.3rem; color: var(--accent); margin-bottom: 8px; }
  .tac-status { font-size: 0.75rem; font-weight: 700; margin-bottom: 10px; }
  .tac-status.avail { color: var(--green); }
  .tac-status.occup { color: var(--red); }
  .tac-actions { display: flex; gap: 6px; justify-content: center; }

  /* ===== MODALS ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    display: none;
  }

  .modal-overlay.open { display: flex; }

  .admin-modal {
    background: var(--dark2);
    border-radius: 24px;
    padding: 32px;
    max-width: 500px;
    width: 94%;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    border: 2px solid rgba(255,255,255,0.08);
    animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-title {
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
    color: var(--accent);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 0.85rem; font-weight: 700; color: var(--text2); margin-bottom: 6px; display: block; }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: var(--dark3);
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-select option { background: var(--dark3); }

  .emoji-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .emoji-opt {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.1);
    background: var(--dark3);
    font-size: 1.4rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .emoji-opt:hover, .emoji-opt.sel { border-color: var(--accent); background: rgba(255,217,61,0.1); }

  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  /* ===== NOTIFICATION TOAST ===== */
  .toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    background: var(--card-bg);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 14px 18px;
    min-width: 280px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: toastIn 0.3s ease;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .toast.new-order { border-left: 4px solid var(--accent); }
  .toast.success { border-left: 4px solid var(--green); }
  .toast.error { border-left: 4px solid var(--red); }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--dark2); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .topbar { padding: 12px 16px; }
    .page { padding: 16px; }
    .menu-admin-grid { grid-template-columns: 1fr 1fr; }
  }

  .hamburger {
    display: none;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--text);
  }

  @media (max-width: 768px) { .hamburger { display: block; } }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
  }

  .empty-state .es-icon { font-size: 4rem; margin-bottom: 12px; opacity: 0.3; }
  .empty-state p { font-family: 'Fredoka One', cursive; font-size: 1rem; }
</style>
</head>
<body>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<!-- MENU MODAL -->
<div class="modal-overlay" id="menuModal">
  <div class="admin-modal">
    <div class="modal-title" id="menuModalTitle">➕ Tambah Menu</div>
    <input type="hidden" id="menuEditId">
    <div class="form-group">
      <label class="form-label">Nama Menu</label>
      <input class="form-input" id="menuName" placeholder="e.g. Nasi Goreng Spesial">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group">
        <label class="form-label">Harga (Rp)</label>
        <input class="form-input" id="menuPrice" type="number" placeholder="25000">
      </div>
      <div class="form-group">
        <label class="form-label">Kategori</label>
        <select class="form-select" id="menuCategory">
          <option value="makanan">🍳 Makanan</option>
          <option value="minuman">🧋 Minuman</option>
          <option value="camilan">🧁 Camilan</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Deskripsi</label>
      <textarea class="form-textarea" id="menuDesc" rows="2" placeholder="Deskripsi singkat menu..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Pilih Emoji Ikon</label>
      <div class="emoji-picker" id="emojiPicker"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeMenuModal()">Batal</button>
      <button class="btn btn-primary" onclick="saveMenu()">💾 Simpan</button>
    </div>
  </div>
</div>

<!-- TABLE MODAL -->
<div class="modal-overlay" id="tableModal">
  <div class="admin-modal">
    <div class="modal-title">🪑 Tambah Meja</div>
    <div class="form-group">
      <label class="form-label">Nomor Meja</label>
      <input class="form-input" id="tableNumber" type="number" placeholder="e.g. 13" min="1">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeTableModal()">Batal</button>
      <button class="btn btn-primary" onclick="saveTable()">💾 Tambah Meja</button>
    </div>
  </div>
</div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <span class="logo-emoji">🍜</span>
    <h2>Warung Kecil Bahagia</h2>
    <p>Admin Panel v1.0</p>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Menu Utama</div>
    <button class="nav-item active" data-page="dashboard" onclick="switchPage('dashboard',this)">
      <span class="nav-icon">📊</span> Dashboard
    </button>
    <button class="nav-item" data-page="orders" onclick="switchPage('orders',this)">
      <span class="nav-icon">🧾</span> Pesanan Masuk
      <span class="nav-badge" id="newOrderBadge">0</span>
    </button>
    <div class="nav-label">Manajemen</div>
    <button class="nav-item" data-page="menu" onclick="switchPage('menu',this)">
      <span class="nav-icon">🍽️</span> Kelola Menu
    </button>
    <button class="nav-item" data-page="tables" onclick="switchPage('tables',this)">
      <span class="nav-icon">🪑</span> Kelola Meja
    </button>
  </nav>
  <div class="sidebar-footer">
    <a class="go-customer" href="index.html" target="_blank">
      🔗 Buka Halaman Customer
    </a>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <h1 id="pageTitle">📊 Dashboard</h1>
    </div>
    <div class="topbar-right">
      <div class="live-indicator">
        <div class="live-dot"></div>
        Live
      </div>
      <div class="admin-name">👨‍🍳 Pemilik</div>
    </div>
  </div>

  <!-- ===== DASHBOARD ===== -->
  <div class="page active" id="page-dashboard">
    <div class="stats-grid">
      <div class="stat-card s1">
        <div class="stat-icon">📋</div>
        <div class="stat-label">Total Pesanan Hari Ini</div>
        <div class="stat-value" id="stat-today">0</div>
      </div>
      <div class="stat-card s2">
        <div class="stat-icon">💰</div>
        <div class="stat-label">Pendapatan Hari Ini</div>
        <div class="stat-value" id="stat-revenue">Rp 0</div>
      </div>
      <div class="stat-card s3">
        <div class="stat-icon">⏳</div>
        <div class="stat-label">Pesanan Menunggu</div>
        <div class="stat-value" id="stat-pending">0</div>
      </div>
      <div class="stat-card s4">
        <div class="stat-icon">🪑</div>
        <div class="stat-label">Meja Aktif</div>
        <div class="stat-value" id="stat-tables">0</div>
      </div>
    </div>

    <div class="section-hdr">
      <h2>🔥 Pesanan Terbaru</h2>
      <button class="btn btn-ghost btn-sm" onclick="switchPage('orders', document.querySelector('[data-page=orders]'))">Lihat Semua →</button>
    </div>
    <div id="recentOrders" class="orders-container"></div>
  </div>

  <!-- ===== ORDERS ===== -->
  <div class="page" id="page-orders">
    <div class="orders-filters">
      <button class="filter-btn active" data-filter="semua" onclick="filterOrders('semua',this)">Semua</button>
      <button class="filter-btn" data-filter="baru" onclick="filterOrders('baru',this)">⏳ Baru</button>
      <button class="filter-btn" data-filter="diproses" onclick="filterOrders('diproses',this)">🔥 Diproses</button>
      <button class="filter-btn" data-filter="selesai" onclick="filterOrders('selesai',this)">✅ Selesai</button>
      <button class="filter-btn" data-filter="dibatalkan" onclick="filterOrders('dibatalkan',this)">❌ Dibatalkan</button>
      <button class="btn btn-danger btn-sm" style="margin-left:auto;" onclick="clearAllOrders()">🗑️ Bersihkan Semua</button>
    </div>
    <div id="allOrders" class="orders-container"></div>
  </div>

  <!-- ===== MENU ===== -->
  <div class="page" id="page-menu">
    <div class="section-hdr">
      <h2>🍽️ Daftar Menu <span id="menuCount" style="font-size:0.85rem;color:var(--text2);font-family:Nunito;"></span></h2>
      <button class="btn btn-primary" onclick="openMenuModal()">➕ Tambah Menu</button>
    </div>
    <div class="menu-admin-grid" id="menuAdminGrid"></div>
  </div>

  <!-- ===== TABLES ===== -->
  <div class="page" id="page-tables">
    <div class="section-hdr">
      <h2>🪑 Kelola Meja</h2>
      <button class="btn btn-primary" onclick="openTableModal()">➕ Tambah Meja</button>
    </div>
    <div class="table-admin-grid" id="tableAdminGrid"></div>
  </div>
</div>

<script>
// ========== DATA ==========
const defaultMenu = [
  { id: 1, name: 'Nasi Goreng Spesial', price: 25000, category: 'makanan', emoji: '🍳', desc: 'Nasi goreng dengan topping telur, ayam, dan sayuran segar', available: true, isNew: false },
  { id: 2, name: 'Mie Ayam Bakso', price: 22000, category: 'makanan', emoji: '🍜', desc: 'Mie dengan ayam cincang dan bakso kenyal kuah kaldu', available: true, isNew: true },
  { id: 3, name: 'Ayam Goreng Crispy', price: 28000, category: 'makanan', emoji: '🍗', desc: 'Ayam goreng renyah bumbu rahasia keluarga', available: true, isNew: false },
  { id: 4, name: 'Gado-Gado', price: 18000, category: 'makanan', emoji: '🥗', desc: 'Sayuran segar dengan saus kacang khas Betawi', available: true, isNew: false },
  { id: 5, name: 'Soto Ayam', price: 20000, category: 'makanan', emoji: '🥣', desc: 'Kuah soto kuning hangat dengan suwiran ayam kampung', available: true, isNew: false },
  { id: 6, name: 'Rendang Sapi', price: 35000, category: 'makanan', emoji: '🍖', desc: 'Rendang empuk dengan bumbu rempah pilihan', available: true, isNew: true },
  { id: 7, name: 'Es Teh Manis', price: 6000, category: 'minuman', emoji: '🧊', desc: 'Teh manis dingin segar menyegarkan', available: true, isNew: false },
  { id: 8, name: 'Es Jeruk Peras', price: 8000, category: 'minuman', emoji: '🍊', desc: 'Jeruk peras segar tanpa pengawet', available: true, isNew: false },
  { id: 9, name: 'Jus Alpukat', price: 15000, category: 'minuman', emoji: '🥑', desc: 'Jus alpukat creamy dengan susu kental manis', available: true, isNew: false },
  { id: 10, name: 'Kopi Susu', price: 12000, category: 'minuman', emoji: '☕', desc: 'Kopi robusta lokal dengan susu segar', available: true, isNew: true },
  { id: 11, name: 'Bolu Kukus Pelangi', price: 10000, category: 'camilan', emoji: '🧁', desc: 'Bolu kukus lembut warna-warni yang menggemaskan', available: true, isNew: true },
  { id: 12, name: 'Pisang Goreng Keju', price: 12000, category: 'camilan', emoji: '🍌', desc: 'Pisang kepok goreng dengan taburan keju leleh', available: true, isNew: false },
  { id: 13, name: 'Cireng Bumbu Rujak', price: 9000, category: 'camilan', emoji: '🥟', desc: 'Cireng crispy dengan sambal rujak pedas manis', available: true, isNew: false },
];

const defaultTables = Array.from({length: 12}, (_, i) => ({ number: i + 1, available: true }));

const emojiList = ['🍳','🍜','🍗','🥗','🥣','🍖','🍱','🌮','🥙','🍛','🥩','🍝','🧊','🍊','🥑','☕','🧋','🧃','🍹','🍺','🧁','🍌','🥟','🍰','🍮','🍩','🍿','🫔','🥞','🧇'];

let selectedEmoji = '🍽️';
let currentOrderFilter = 'semua';
let menuNextId = 100;

function getMenu() {
  try { return JSON.parse(localStorage.getItem('wkb_menu') || 'null') || defaultMenu; } catch { return defaultMenu; }
}

function saveMenu(menu) {
  localStorage.setItem('wkb_menu', JSON.stringify(menu));
  notifyCustomer('wkb_menu');
}

function getTables() {
  try {
    const stored = localStorage.getItem('wkb_tables');
    if (stored) {
      const arr = JSON.parse(stored);
      return arr.map(t => typeof t === 'object' ? t : { number: t, available: true });
    }
    return defaultTables;
  } catch { return defaultTables; }
}

function saveTables(tables) {
  localStorage.setItem('wkb_tables', JSON.stringify(tables));
  notifyCustomer('wkb_tables');
}

function getOrders() {
  try { return JSON.parse(localStorage.getItem('wkb_orders') || '[]'); } catch { return []; }
}

function saveOrders(orders) {
  localStorage.setItem('wkb_orders', JSON.stringify(orders));
}

function notifyCustomer(key) {
  // Trigger storage event for cross-tab communication
  const val = localStorage.getItem(key);
  // Re-set to trigger storage event in other tabs
  localStorage.setItem(key + '_ts', Date.now().toString());
}

// ========== NAVIGATION ==========
function switchPage(page, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  if (btn) btn.classList.add('active');

  const titles = { dashboard: '📊 Dashboard', orders: '🧾 Pesanan Masuk', menu: '🍽️ Kelola Menu', tables: '🪑 Kelola Meja' };
  document.getElementById('pageTitle').textContent = titles[page] || page;

  if (page === 'dashboard') renderDashboard();
  if (page === 'orders') renderOrders(currentOrderFilter);
  if (page === 'menu') renderMenuAdmin();
  if (page === 'tables') renderTablesAdmin();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ========== DASHBOARD ==========
function renderDashboard() {
  const orders = getOrders();
  const today = new Date().toDateString();
  const todayOrders = orders.filter(o => new Date(o.time).toDateString() === today);
  const todayRevenue = todayOrders.reduce((s, o) => s + o.total, 0);
  const pending = orders.filter(o => o.status === 'baru' || o.status === 'diproses').length;
  const tables = getTables();
  const occupied = tables.filter(t => !t.available).length;

  document.getElementById('stat-today').textContent = todayOrders.length;
  document.getElementById('stat-revenue').textContent = `Rp ${todayRevenue.toLocaleString('id-ID')}`;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-tables').textContent = `${occupied}/${tables.length}`;

  const newOrders = orders.filter(o => o.status === 'baru').length;
  document.getElementById('newOrderBadge').textContent = newOrders;

  const recent = [...orders].reverse().slice(0, 5);
  const container = document.getElementById('recentOrders');
  if (recent.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="es-icon">📋</div><p>Belum ada pesanan hari ini</p></div>';
    return;
  }
  container.innerHTML = '';
  recent.forEach(order => container.appendChild(createOrderCard(order)));
}

// ========== ORDERS ==========
function renderOrders(filter) {
  currentOrderFilter = filter;
  const orders = getOrders();
  let filtered = filter === 'semua' ? orders : orders.filter(o => o.status === filter);
  filtered = [...filtered].reverse();

  const container = document.getElementById('allOrders');
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="es-icon">🧾</div><p>Tidak ada pesanan ${filter === 'semua' ? '' : `dengan status "${filter}"`}</p></div>`;
    return;
  }
  container.innerHTML = '';
  filtered.forEach(order => container.appendChild(createOrderCard(order)));
}

function filterOrders(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders(filter);
}

function createOrderCard(order) {
  const card = document.createElement('div');
  card.className = `order-card status-${order.status}`;
  const time = new Date(order.time);
  const timeStr = time.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });

  const payIcon = order.payment === 'qris' ? '📱 QRIS' : '💵 Kasir';

  const statusActions = {
    baru: `<button class="btn btn-primary btn-sm" onclick="updateOrderStatus('${order.id}','diproses')">🔥 Proses</button><button class="btn btn-danger btn-sm" onclick="updateOrderStatus('${order.id}','dibatalkan')">❌ Batalkan</button>`,
    diproses: `<button class="btn btn-success btn-sm" onclick="updateOrderStatus('${order.id}','selesai')">✅ Selesai</button>`,
    selesai: `<span style="color:var(--green);font-size:0.8rem;font-weight:700;">✅ Pesanan Selesai</span>`,
    dibatalkan: `<span style="color:var(--red);font-size:0.8rem;font-weight:700;">❌ Dibatalkan</span>`,
  };

  card.innerHTML = `
    <div class="order-top">
      <div class="order-meta">
        <span class="order-id">#${order.id}</span>
        <span class="order-table-tag">🪑 Meja ${order.table}</span>
        <span class="status-tag ${order.status}">${getStatusLabel(order.status)}</span>
        <span class="pay-tag">${payIcon}</span>
      </div>
      <span class="order-time">${timeStr}</span>
    </div>
    <div class="order-items">
      ${order.items.map(i => `<div class="order-item-tag">${i.emoji || '🍽️'} ${i.name} <strong>×${i.qty}</strong></div>`).join('')}
    </div>
    ${order.note ? `<div class="order-note">📝 "${order.note}"</div>` : ''}
    <div class="order-bottom">
      <span class="order-total">Rp ${Number(order.total).toLocaleString('id-ID')}</span>
      <div class="status-actions">${statusActions[order.status] || ''}</div>
    </div>`;
  return card;
}

function getStatusLabel(status) {
  const labels = { baru: '⏳ Baru', diproses: '🔥 Diproses', selesai: '✅ Selesai', dibatalkan: '❌ Dibatalkan' };
  return labels[status] || status;
}

function updateOrderStatus(id, newStatus) {
  const orders = getOrders();
  const idx = orders.findIndex(o => o.id === id);
  if (idx === -1) return;
  orders[idx].status = newStatus;
  saveOrders(orders);
  renderDashboard();
  renderOrders(currentOrderFilter);
  showToast(`Status pesanan #${id} diubah ke ${getStatusLabel(newStatus)}`, 'success');
}

function clearAllOrders() {
  if (!confirm('Yakin mau hapus semua data pesanan?')) return;
  localStorage.removeItem('wkb_orders');
  localStorage.removeItem('wkb_orderCounter');
  renderDashboard();
  renderOrders(currentOrderFilter);
  showToast('Semua pesanan berhasil dihapus', 'success');
}

// ========== MENU ADMIN ==========
function renderMenuAdmin() {
  const menu = getMenu();
  document.getElementById('menuCount').textContent = `(${menu.length} item)`;
  const grid = document.getElementById('menuAdminGrid');
  grid.innerHTML = '';

  const bgColors = ['#FFD93D,#FF9F1C', '#6BCB77,#4D96FF', '#FF6B9D,#C77DFF', '#FF9F1C,#FF4C4C', '#4D96FF,#6BCB77'];

  menu.forEach(item => {
    const card = document.createElement('div');
    card.className = 'menu-admin-card' + (!item.available ? ' unavail' : '');
    const bgIdx = item.id % bgColors.length;
    card.innerHTML = `
      <div class="mac-thumb" style="background:linear-gradient(135deg,${bgColors[bgIdx]});">${item.emoji || '🍽️'}</div>
      <div class="mac-body">
        <div class="mac-name">${item.name}</div>
        <div class="mac-desc">${item.desc || '–'}</div>
        <div class="mac-price">Rp ${Number(item.price).toLocaleString('id-ID')}</div>
        <div class="mac-footer">
          <label class="avail-toggle" onclick="toggleMenuAvail(${item.id})">
            <div class="toggle-switch ${item.available ? 'on' : ''}"></div>
            ${item.available ? 'Tersedia' : 'Habis'}
          </label>
          <button class="btn btn-ghost btn-sm" onclick="openMenuModal(${item.id})">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="deleteMenu(${item.id})">🗑️</button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

function toggleMenuAvail(id) {
  const menu = getMenu();
  const item = menu.find(m => m.id === id);
  if (!item) return;
  item.available = !item.available;
  saveMenu(menu);
  renderMenuAdmin();
  showToast(`${item.name} ${item.available ? 'tersedia' : 'habis'}`, 'success');
}

function deleteMenu(id) {
  if (!confirm('Hapus menu ini?')) return;
  const menu = getMenu().filter(m => m.id !== id);
  saveMenu(menu);
  renderMenuAdmin();
  showToast('Menu berhasil dihapus', 'success');
}

// ========== MENU MODAL ==========
function openMenuModal(editId) {
  const modal = document.getElementById('menuModal');
  document.getElementById('menuModalTitle').textContent = editId ? '✏️ Edit Menu' : '➕ Tambah Menu';

  // Render emoji picker
  const picker = document.getElementById('emojiPicker');
  picker.innerHTML = '';
  emojiList.forEach(em => {
    const btn = document.createElement('button');
    btn.className = 'emoji-opt' + (selectedEmoji === em ? ' sel' : '');
    btn.textContent = em;
    btn.onclick = () => {
      selectedEmoji = em;
      picker.querySelectorAll('.emoji-opt').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
    };
    picker.appendChild(btn);
  });

  if (editId) {
    const item = getMenu().find(m => m.id === editId);
    if (item) {
      document.getElementById('menuEditId').value = editId;
      document.getElementById('menuName').value = item.name;
      document.getElementById('menuPrice').value = item.price;
      document.getElementById('menuCategory').value = item.category;
      document.getElementById('menuDesc').value = item.desc || '';
      selectedEmoji = item.emoji || '🍽️';
      picker.querySelectorAll('.emoji-opt').forEach(b => {
        b.classList.toggle('sel', b.textContent === selectedEmoji);
      });
    }
  } else {
    document.getElementById('menuEditId').value = '';
    document.getElementById('menuName').value = '';
    document.getElementById('menuPrice').value = '';
    document.getElementById('menuCategory').value = 'makanan';
    document.getElementById('menuDesc').value = '';
    selectedEmoji = '🍽️';
  }

  modal.classList.add('open');
}

function closeMenuModal() {
  document.getElementById('menuModal').classList.remove('open');
}

function saveMenu() {
  const name = document.getElementById('menuName').value.trim();
  const price = parseInt(document.getElementById('menuPrice').value);
  const category = document.getElementById('menuCategory').value;
  const desc = document.getElementById('menuDesc').value.trim();
  const editId = document.getElementById('menuEditId').value;

  if (!name || !price) { alert('Nama dan harga wajib diisi!'); return; }

  const menu = getMenu();

  if (editId) {
    const idx = menu.findIndex(m => m.id === parseInt(editId));
    if (idx !== -1) {
      menu[idx] = { ...menu[idx], name, price, category, desc, emoji: selectedEmoji };
    }
  } else {
    menuNextId++;
    const newId = Math.max(...menu.map(m => m.id), 0) + 1;
    menu.push({ id: newId, name, price, category, desc, emoji: selectedEmoji, available: true, isNew: true });
  }

  // Save via the correct function name (not overriding)
  localStorage.setItem('wkb_menu', JSON.stringify(menu));
  localStorage.setItem('wkb_menu_ts', Date.now().toString());
  closeMenuModal();
  renderMenuAdmin();
  showToast(editId ? 'Menu berhasil diperbarui!' : 'Menu baru berhasil ditambahkan!', 'success');
}

// ========== TABLE ADMIN ==========
function renderTablesAdmin() {
  const tables = getTables();
  const grid = document.getElementById('tableAdminGrid');
  grid.innerHTML = '';

  tables.forEach(t => {
    const num = typeof t === 'object' ? t.number : t;
    const avail = typeof t === 'object' ? t.available : true;
    const card = document.createElement('div');
    card.className = 'table-admin-card';
    card.innerHTML = `
      <div class="tac-icon">${avail ? '🪑' : '🔴'}</div>
      <div class="tac-num">Meja ${num}</div>
      <div class="tac-status ${avail ? 'avail' : 'occup'}">${avail ? '✅ Tersedia' : '🔴 Sibuk'}</div>
      <div class="tac-actions">
        <button class="btn btn-ghost btn-sm" onclick="toggleTableStatus(${num})" title="${avail ? 'Tandai Sibuk' : 'Tandai Tersedia'}">${avail ? '🔒' : '🔓'}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteTable(${num})">🗑️</button>
      </div>`;
    grid.appendChild(card);
  });
}

function toggleTableStatus(num) {
  const tables = getTables();
  const idx = tables.findIndex(t => t.number === num);
  if (idx === -1) return;
  tables[idx].available = !tables[idx].available;
  saveTables(tables);
  renderTablesAdmin();
  showToast(`Meja ${num} sekarang ${tables[idx].available ? 'tersedia' : 'sibuk'}`, 'success');
}

function deleteTable(num) {
  if (!confirm(`Hapus Meja ${num}?`)) return;
  const tables = getTables().filter(t => t.number !== num);
  saveTables(tables);
  renderTablesAdmin();
  showToast(`Meja ${num} berhasil dihapus`, 'success');
}

function openTableModal() {
  document.getElementById('tableNumber').value = '';
  document.getElementById('tableModal').classList.add('open');
}

function closeTableModal() {
  document.getElementById('tableModal').classList.remove('open');
}

function saveTable() {
  const num = parseInt(document.getElementById('tableNumber').value);
  if (!num || num < 1) { alert('Masukkan nomor meja yang valid!'); return; }
  const tables = getTables();
  if (tables.find(t => t.number === num)) { alert(`Meja ${num} sudah ada!`); return; }
  tables.push({ number: num, available: true });
  tables.sort((a, b) => a.number - b.number);
  saveTables(tables);
  closeTableModal();
  renderTablesAdmin();
  showToast(`Meja ${num} berhasil ditambahkan!`, 'success');
}

// ========== TOAST ==========
function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✅', 'new-order': '🔔', error: '❌' };
  toast.innerHTML = `<span>${icons[type] || '✅'}</span><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// ========== REAL-TIME ORDER LISTENER ==========
let lastOrderCount = getOrders().length;

function checkNewOrders() {
  const orders = getOrders();
  if (orders.length > lastOrderCount) {
    const newOrders = orders.slice(lastOrderCount);
    newOrders.forEach(o => {
      showToast(`🔔 Pesanan baru #${o.id} dari Meja ${o.table}!`, 'new-order');
    });
    lastOrderCount = orders.length;
    renderDashboard();
    if (document.getElementById('page-orders').classList.contains('active')) {
      renderOrders(currentOrderFilter);
    }
  }
}

// Listen storage events from customer tab
window.addEventListener('storage', (e) => {
  if (e.key === 'wkb_orders') {
    checkNewOrders();
  }
  if (e.key === 'wkb_menu_ts' || e.key === 'wkb_tables_ts') {
    // Re-render if admin updated from another tab
    if (document.getElementById('page-menu').classList.contains('active')) renderMenuAdmin();
    if (document.getElementById('page-tables').classList.contains('active')) renderTablesAdmin();
  }
});

// Also poll every 3 seconds for same-browser instances
setInterval(checkNewOrders, 3000);

// ========== INIT ==========
function init() {
  // Initialize data if not exists
  if (!localStorage.getItem('wkb_menu')) {
    localStorage.setItem('wkb_menu', JSON.stringify(defaultMenu));
  }
  if (!localStorage.getItem('wkb_tables')) {
    localStorage.setItem('wkb_tables', JSON.stringify(defaultTables));
  }

  renderDashboard();
}

init();
</script>
</body>
